# =====================================
#  ENVIRONMENT: PRODUCTION
# =====================================

# Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/softwork}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Swagger Configuration URL
swagger.server.url=http://${API_HOST}:${PORT:8080}

# JPA / Hibernate
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

# Server Port
server.port=${PORT:8080}

#Inject data
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=data.sql
spring.sql.init.mode=always

# Security
authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.expiration.days=${JWT_EXPIRATION_DAYS:7}