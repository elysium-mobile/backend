# =====================================
#  ENVIRONMENT: DEVELOPMENT
# =====================================

# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/softwork
spring.datasource.username=postgres
spring.datasource.password=postgres

# Swagger Configuration URL
swagger.server.url=http://localhost:8092

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Inject Initial Data for tests
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
# Server Port
server.port=8092

# Security
authorization.jwt.secret=WriteHereYourSecretStringForTokenSigningCredentials

CLOUDINARY_URL=***

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

stripe.secret-key=***
stripe.webhook-secret=***

spring.ai.google.genai.api-key=***
spring.ai.google.chat.model=gemini-2.5-flash
spring.ai.google.genai.chat.temperature=0.4